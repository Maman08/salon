# ─── Nginx reverse proxy for Grenix (Hostinger VPS) ──────────────────────────
# Copy to /etc/nginx/sites-available/grenix.conf, symlink into sites-enabled,
# then run certbot (see DEPLOY-HOSTINGER.md) to add the SSL (443) blocks
# automatically. This file starts as HTTP-only; certbot rewrites it.
#
#   sudo cp backend/nginx/grenix.conf /etc/nginx/sites-available/grenix.conf
#   sudo ln -s /etc/nginx/sites-available/grenix.conf /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d grenix.store -d www.grenix.store \
#                        -d api.grenix.store -d media.grenix.store
# ──────────────────────────────────────────────────────────────────────────────

# ── Frontend: grenix.store + www ──────────────────────────────────────────────
server {
    listen 80;
    server_name grenix.store www.grenix.store;

    client_max_body_size 25M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── Backend API: api.grenix.store ─────────────────────────────────────────────
server {
    listen 80;
    server_name api.grenix.store;

    client_max_body_size 25M;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── Media (MinIO S3 API): media.grenix.store ──────────────────────────────────
server {
    listen 80;
    server_name media.grenix.store;

    client_max_body_size 25M;

    location / {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # MinIO needs these for large/streamed objects
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
